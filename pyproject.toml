[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rts-nano"
version = "0.1.0"
description = "A deterministic real-time strategy game core with Pygame and headless execution"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pygame-ce>=2.5.7",
]


[dependency-groups]
dev = [
    "tox==4.44.0",
    "tox-uv==1.29.0",
    "ruff==0.15.1",
    "ty==0.0.18",
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "pytest-mock==3.15.1",
    "pytest-randomly==4.0.1",
    "pytest-xdist==3.8.0",
    "pytest-timeout==2.4.0",
    "pre-commit==4.5.1",
]

[tool.uv]
package = true


[tool.coverage.run]
source = ["src/rts_nano"]
branch = true
parallel = true
relative_files = true
omit = ["src/rts_nano/main.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 50

[tool.hatch.build.targets.wheel]
packages = ["src/rts_nano"]
